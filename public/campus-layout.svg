    <g id="tree"><circle r="12" fill="#e1e5d3"/><path d="M-9-3Q-7-14 3-11Q16-7 10 4Q8 15-3 10Q-14 8-9-3Z" fill="#82966c" stroke="#6e835a" stroke-width="1"/><circle cx="-3" cy="-3" r="4" fill="#a0ae83"/></g>
    <g id="fountain"><circle r="10" fill="none" stroke="#d7e8df" stroke-width="1"/><circle r="6" fill="#eaf2e9" fill-opacity=".55"/><path d="M-7 0Q-4-10 0 0Q4-10 7 0M0-7Q-10-4 0 0Q-10 4 0 7M7 0Q4 10 0 0Q-4 10-7 0M0 7Q10 4 0 0Q10-4 0-7" fill="none" stroke="#f4faf3" stroke-width="1"/><circle r="2" fill="#f4faf3"/></g>
    <g id="dome"><rect x="-39" y="-28" width="78" height="56" rx="2" fill="#cdb69a"/><rect x="-35" y="-24" width="70" height="48" fill="#eee0c9" stroke="#b8976b"/><rect x="-29" y="-20" width="58" height="40" fill="#e3ccb0" stroke="#c3a27e"/><circle r="20" fill="#f7ead5" stroke="#b89670"/><circle r="15" fill="none" stroke="#d5bb98"/><path d="M-20 0H20M0-20V20M-14-14 14 14M-14 14 14-14" stroke="#d5bb98" stroke-width=".8"/><circle r="4" fill="#b18a54"/></g>
