<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
  <title id="title">Exhibition campus layout — entrance to mandir</title>
  <desc id="desc">A proposed exhibition campus, not the real Robbinsville site plan. From the entrance at the bottom, domes one, two and three line the left; six, five and four line the right. A fountain garden with five central fountain groups and a matching pair of round fountains in its entrance parterres leads to the centered Robbinsville Akshardham mandir reference at the top. Continuous walks connect around both ends of the garden.</desc>
